name = "Erdos173"
defaultTargets = ["OAI", "Erdos173", "Challenge", "Solution"]

# No silently-introduced implicit binders anywhere in the corpus.
[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

# Modules from openai/math used by the proof, with narrowed imports.
[[lean_lib]]
name = "OAI"
globs = ["OAI.+"]

[[lean_lib]]
name = "Erdos173"
globs = ["Erdos173.+"]

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
